<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#991b1b">
<title>Menu Utama - WAINI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.header {
    background: #991b1b;
    color: white;
    padding: 18px 16px 23px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 22px;
}

.logo {
    width: 40px;
    height: 40px;
    background: white;
    color: #991b1b;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.brand-info {
    flex: 1;
}

.brand-info strong {
    font-size: 17px;
}

.brand-info small {
    display: block;
    color: #fecaca;
    font-size: 11px;
    margin-top: 3px;
}

.menu-icon {
    font-size: 23px;
    cursor: pointer;
    background: none;
    border: none;
    color: white;
}

.header h1 {
    font-size: 23px;
    margin-bottom: 7px;
}

.header p {
    color: #fee2e2;
    font-size: 12px;
    line-height: 1.5;
}

.container {
    max-width: 550px;
    padding: 18px 15px;
    margin: auto;
    display: none;
}

.container.siap {
    display: block;
}

.menu-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 11px;
    padding: 13px;
    cursor: pointer;
    transition: .15s;
}

.menu-card:active {
    transform: scale(.98);
}

.menu-card:hover {
    border-color: #d1d5db;
}

.menu-content {
    display: flex;
    align-items: center;
    gap: 10px;
}

.menu-icon-box {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 9px;
    background: #fee2e2;
    color: #991b1b;
    display: flex;
    justify-content: center;
    align-items: center;
}

.menu-icon-box svg {
    width: 23px;
    height: 23px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.menu-text {
    flex: 1;
    min-width: 0;
}

.menu-text strong {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
}

.menu-text small {
    display: block;
    color: #777;
    font-size: 11px;
    line-height: 1.5;
}

.arrow {
    color: #9ca3af;
    font-size: 23px;
}

.menu-profil {
    margin-bottom: 12px;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.menu-bawah {
    margin-top: 12px;
}

.judul-kelompok {
    margin: 22px 0 11px;
    padding-bottom: 9px;
    border-bottom: 1px solid #e5e7eb;
}

.judul-kelompok strong {
    font-size: 12px;
    color: #991b1b;
    letter-spacing: .4px;
}

.judul-kelompok small {
    display: block;
    font-size: 10px;
    color: #888;
    margin-top: 4px;
}

.footer {
    background: #991b1b;
    border-radius: 9px;
    padding: 15px;
    margin-top: 12px;
    text-align: center;
}

.footer strong {
    display: block;
    color: white;
    font-size: 13px;
    margin-bottom: 5px;
}

.footer small {
    display: block;
    color: #fecaca;
    font-size: 10px;
}

#status-pemuatan {
    max-width: 550px;
    margin: 20px auto;
    padding: 0 15px;
    color: #991b1b;
    font-size: 12px;
    text-align: center;
    line-height: 1.6;
}

@media (max-width: 360px) {
    .menu-grid {
        gap: 8px;
    }

    .menu-card {
        padding: 11px;
    }

    .menu-icon-box {
        width: 38px;
        height: 38px;
    }

    .menu-text strong {
        font-size: 12px;
    }

    .menu-text small {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">

        <div class="logo">♙</div>

        <div class="brand-info">
            <strong>WAINI</strong>
            <small>Portal Anggota Divisi</small>
        </div>

        <button
            class="menu-icon"
            type="button"
            onclick="bukaMenu()"
            aria-label="Keluar"
        >☰</button>

    </div>

    <h1>Menu Utama</h1>

    <p id="salam-pengguna">
        Memeriksa akun pengguna...
    </p>

</header>

<div id="status-pemuatan">
    Menghubungkan ke WAINI...
</div>

<main class="container" id="menu-container">

    <div id="area-profil"></div>

    <div id="area-menu-umum" class="menu-grid"></div>

    <div id="area-menu-bawah"></div>

    <div id="area-admin" style="display:none;">

        <div class="judul-kelompok">
            <strong>MENU KHUSUS SUPER ADMIN</strong>

            <small>
                Pengelolaan dan pengaturan sistem WAINI
            </small>
        </div>

        <div id="area-menu-admin" class="menu-grid"></div>

    </div>

    <div class="footer">
        <strong>WAINI</strong>

        <small>
            Portal Anggota Divisi • 2026
        </small>
    </div>

</main>


<script type="module">

// =====================================
// 1. IMPORT FIREBASE
// =====================================

import { firebaseConfig } from "./firebase.js";

import {
    initializeApp,
    getApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// =====================================
// 2. KONEKSI FIREBASE
// =====================================

let app;

try {
    app = getApp();
} catch (error) {
    app = initializeApp(firebaseConfig);
}

const auth = getAuth(app);
const db = getFirestore(app);


// =====================================
// 3. VARIABEL PENGGUNA
// =====================================

let penggunaAktif = null;
let rolePengguna = "";
let hakAksesPengguna = [];
let superAdmin = false;
let akunSiap = false;


// =====================================
// 4. MENU BAWAAN KARYAWAN
// =====================================

const MENU_BAWAAN_KARYAWAN = [
    "pengajuan_cuti",
    "saldo_cuti",
    "riwayat_absensi",
    "riwayat_cuti"
];


// =====================================
// 5. MENU KHUSUS SUPER ADMIN
// =====================================

const MENU_ADMIN = [
    "data_karyawan",
    "verifikasi_pendaftaran",
    "pengaturan_hak_akses",
    "kelola_akun",
    "pengaturan_sistem"
];


// =====================================
// 6. IKON MENU
// =====================================

const ikonMenu = {

    <path d="M10 21h4"></path>
    `,

    bantuan: `
    <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-.9L3 21l1.9-5.5a8.5 8.5 0 1 1 16.1-4"></path>

    `,

    kelola_akun: `
    <circle cx="12" cy="8" r="4"></circle>
    <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>

    `,

    pengaturan_sistem: `
    <circle cx="12" cy="12" r="3"></circle>

    `
};


// =====================================
// 7. NORMALISASI DATA
// =====================================

function normalisasiKode(kode) {

    return String(kode || "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

}

function normalisasiRole(role) {

    return normalisasiKode(role);

}

function normalisasiArray(data) {

    if (!Array.isArray(data)) return [];

    return data
        .filter(item => typeof item === "string")
        .map(item => normalisasiKode(item))
        .filter(Boolean);

}


// =====================================
// 8. MEMBUAT KARTU MENU
// =====================================

function buatKartu(menu) {

    const kartu = document.createElement("div");

    kartu.className = "menu-card";

    const isi = document.createElement("div");
    isi.className = "menu-content";

    const iconBox = document.createElement("div");
    iconBox.className = "menu-icon-box";

    const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
    );

    svg.setAttribute("viewBox", "0 0 24 24");

    svg.innerHTML =
        ikonMenu[menu.kode] ||
        '<circle cx="12" cy="12" r="8"></circle>';

    iconBox.appendChild(svg);

    const teks = document.createElement("div");
    teks.className = "menu-text";

    const nama = document.createElement("strong");
    nama.textContent = menu.nama || "Menu";

    const deskripsi = document.createElement("small");
    deskripsi.textContent = menu.deskripsi || "";

    teks.appendChild(nama);
    teks.appendChild(deskripsi);

    const panah = document.createElement("div");
    panah.className = "arrow";
    panah.textContent = "›";

    isi.appendChild(iconBox);
    isi.appendChild(teks);
    isi.appendChild(panah);

    kartu.appendChild(isi);

    kartu.addEventListener("click", () => {

        if (!akunSiap) return;

        let halaman = String(
            menu.halaman || ""
        ).trim();

        // Alamat khusus verifikasi pendaftaran

        if (menu.kode === "verifikasi_pendaftaran") {
            halaman = "verifikasi-akun.html";
        }

        if (!/^[a-zA-Z0-9_-]+\.html$/.test(halaman)) {

            alert("Alamat halaman menu tidak valid.");

            return;

        }

        window.location.href = halaman;

    });

    return kartu;

}


// =====================================
// 9. PEMERIKSAAN HAK AKSES MENU
// =====================================

function bolehLihatMenu(menu) {

    const kode = normalisasiKode(menu.kode);

    const aksesRole = normalisasiArray(
        menu.akses_role
    );

    // Super Admin dapat melihat semua menu aktif

    if (superAdmin) {
        return true;
    }

    // Profil dapat dilihat semua akun aktif

    if (kode === "profil") {
        return true;
    }

    // =================================
    // EMPAT MENU BAWAAN KARYAWAN
    // =================================

    if (
        rolePengguna === "karyawan" &&
        MENU_BAWAAN_KARYAWAN.includes(kode)
    ) {

        // Jika akses_role belum diisi,
        // menu bawaan dianggap untuk karyawan.
        // Jika sudah diisi, harus memuat karyawan.

        if (
            aksesRole.length > 0 &&
            !aksesRole.includes("karyawan")
        ) {
            return false;
        }

        // Menu bawaan tidak membutuhkan
        // penugasan hak_akses tambahan.

        return true;

    }

    // =================================
    // PEMERIKSAAN ROLE MENU LAIN
    // =================================

    const daftarRolePengguna = [rolePengguna];

    if (
        [
            "leader",
            "leader_absensi",
            "petugas_absensi"
        ].includes(rolePengguna)
    ) {
        daftarRolePengguna.push("karyawan");
    }

    // Jika akses_role kosong pada menu selain
    // menu bawaan, menu tidak diberikan otomatis.

    const roleDiizinkan = daftarRolePengguna.some(
        role => aksesRole.includes(role)
    );

    if (!roleDiizinkan) {
        return false;
    }

    // Informasi dan bantuan tidak membutuhkan
    // penugasan hak akses tambahan.

    if (
        kode === "informasi" ||
        kode === "bantuan"
    ) {
        return true;
    }

    // Hak akses tambahan hanya diperiksa
    // jika memang diwajibkan oleh menu.

    if (menu.perlu_hak_akses === true) {

        return hakAksesPengguna.includes(kode);

    }

    return true;

}


// =====================================
// 10. MEMUAT MENU FIRESTORE
// =====================================

async function muatMenuFirestore() {

    const status = document.getElementById(
        "status-pemuatan"
    );

    try {

        const snapshot = await getDocs(
            collection(db, "menu_utama")
        );

        const semuaMenu = [];

        snapshot.forEach(dokumen => {

            const data = dokumen.data();

            semuaMenu.push({

                id: dokumen.id,

                ...data,

                kode: normalisasiKode(
                    data.kode || dokumen.id
                )

            });

        });

        // Hanya menu aktif

        const menuAktif = semuaMenu.filter(
            menu => menu.aktif === true
        );

        // Filter berdasarkan hak akses

        const menuTampil = menuAktif.filter(
            menu => bolehLihatMenu(menu)
        );

        // Urutkan menu

        menuTampil.sort((a, b) =>
            Number(a.urutan || 999) -
            Number(b.urutan || 999)
        );

        // Area tampilan

        const areaProfil = document.getElementById(
            "area-profil"
        );

        const areaUmum = document.getElementById(
            "area-menu-umum"
        );

        const areaBawah = document.getElementById(
            "area-menu-bawah"
        );

        const areaAdmin = document.getElementById(
            "area-menu-admin"
        );

        areaProfil.replaceChildren();
        areaUmum.replaceChildren();
        areaBawah.replaceChildren();
        areaAdmin.replaceChildren();

        // =================================
        // MENAMPILKAN MENU
        // =================================

        menuTampil.forEach(menu => {

            const kartu = buatKartu(menu);

            // PROFIL

            if (menu.kode === "profil") {

                kartu.classList.add("menu-profil");

                areaProfil.appendChild(kartu);

            }

            // INFORMASI DAN BANTUAN

            else if (
                menu.kode === "informasi" ||
                menu.kode === "bantuan"
            ) {

                kartu.classList.add("menu-bawah");

                areaBawah.appendChild(kartu);

            }

            // MENU KHUSUS SUPER ADMIN DINAMIS

            else if (
                superAdmin &&
                (
                    MENU_ADMIN.includes(menu.kode) ||
                    normalisasiArray(menu.akses_role)
                        .includes("super_admin")
                )
            ) {

                areaAdmin.appendChild(kartu);

            }

            // MENU UMUM

            else {

                areaUmum.appendChild(kartu);

            }

        });

        // Tampilkan area admin jika tersedia

        document.getElementById(
            "area-admin"
        ).style.display =
            superAdmin && areaAdmin.children.length > 0
                ? "block"
                : "none";

        // Tampilkan halaman

        document.getElementById(
            "menu-container"
        ).classList.add("siap");

        akunSiap = true;

        status.style.display = "none";

        // =================================
        // DIAGNOSTIK
        // =================================

        const kodeAktif = menuAktif.map(m => m.kode);

        const kodeTampil = menuTampil.map(m => m.kode);

        console.log("========== WAINI MENU ==========");

        console.log("Jumlah dokumen:", snapshot.size);

        console.log("Jumlah menu aktif:", menuAktif.length);

        console.log("Jumlah menu tampil:", menuTampil.length);

        console.log("Role pengguna:", rolePengguna);

        console.log("Hak akses:", hakAksesPengguna);

        console.log("Super Admin:", superAdmin);

        console.log("Menu aktif:", kodeAktif);

        console.log("Menu tampil:", kodeTampil);

        // Periksa apakah empat menu dasar tersedia

        if (rolePengguna === "karyawan") {

            const belumAda = MENU_BAWAAN_KARYAWAN.filter(
                kode => !kodeAktif.includes(kode)
            );

            if (belumAda.length > 0) {

                console.warn(
                    "Menu bawaan belum dibuat atau belum aktif:",
                    belumAda
                );

                status.style.display = "block";

                status.textContent =
                    "Perhatian: Menu berikut belum tersedia atau belum aktif di Firestore: " +
                    belumAda.join(", ");

            }

        }

        // Jika tidak ada menu

        if (menuTampil.length === 0) {

            status.style.display = "block";

            if (snapshot.size === 0) {

                status.textContent =
                    "Koleksi menu_utama belum memiliki dokumen.";

            } else if (menuAktif.length === 0) {

                status.textContent =
                    "Belum ada menu aktif di Firestore.";

            } else {

                status.textContent =
                    "Belum ada menu yang sesuai dengan hak akses akun.";

            }

        }

    } catch (error) {

        console.error(
            "Gagal membaca menu Firestore:",
            error
        );

        status.style.display = "block";

        status.textContent =
            "Gagal membaca menu dari Firestore. Kode: " +
            (error.code || error.message);

    }

}


// =====================================
// 11. MEMERIKSA DATA PENGGUNA
// =====================================

async function periksaPengguna(user) {

    const status = document.getElementById(
        "status-pemuatan"
    );

    try {

        const referensi = doc(
            db,
            "pengguna",
            user.uid
        );

        const hasil = await getDoc(referensi);

        if (!hasil.exists()) {

            alert(
                "Data pengguna tidak ditemukan. Hubungi Super Admin."
            );

            await signOut(auth);

            window.location.replace("index.html");

            return;

        }

        const data = hasil.data();

        // Periksa status akun

        if (
            String(data.status || "")
                .trim()
                .toLowerCase() !== "aktif"
        ) {

            alert(
                "Akun belum aktif. Silakan hubungi Super Admin."
            );

            await signOut(auth);

            window.location.replace("index.html");

            return;

        }

        // Simpan data pengguna

        penggunaAktif = data;

        rolePengguna = normalisasiRole(data.role);

        hakAksesPengguna = normalisasiArray(
            data.hak_akses
        );

        superAdmin = rolePengguna === "super_admin";

        // Tampilkan salam

        const nama =
            data.nama ||
            data.nik ||
            "Pengguna";

        const jabatan =
            data.jabatan ||
            "Anggota Divisi";

        document.getElementById(
            "salam-pengguna"
        ).textContent =
            "Selamat datang, " +
            nama +
            " • " +
            jabatan;

        // Diagnostik pengguna

        console.log("========== AKUN WAINI ==========");

        console.log("Nama:", nama);

        console.log("Role:", rolePengguna);

        console.log("Status:", data.status);

        console.log("NIK:", data.nik);

        console.log("Hak akses:", hakAksesPengguna);

        console.log("Super Admin:", superAdmin);

        // Muat menu

        await muatMenuFirestore();

    } catch (error) {

        console.error(
            "Kesalahan pemeriksaan pengguna:",
            error
        );

        status.style.display = "block";

        status.textContent =
            "Gagal memeriksa akun. Kode: " +
            (error.code || error.message);

    }

}


// =====================================
// 12. PEMERIKSAAN LOGIN
// =====================================

onAuthStateChanged(auth, async user => {

    akunSiap = false;

    if (!user) {

        window.location.replace("index.html");

        return;

    }

    await periksaPengguna(user);

});


// =====================================
// 13. LOGOUT
// =====================================

window.bukaMenu = async function() {

    if (!akunSiap) return;

    const konfirmasi = confirm(
        "WAINI - Portal Anggota Divisi\n\n" +
        "Apakah Anda ingin keluar dari akun?"
    );

    if (!konfirmasi) return;

    try {

        await signOut(auth);

        window.location.replace("index.html");

    } catch (error) {

        console.error("Logout gagal:", error);

        alert("Gagal keluar. Silakan coba kembali.");

    }

};

</script>
