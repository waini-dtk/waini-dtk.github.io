// =====================================
// 7. FUNGSI NORMALISASI
// =====================================

function normalisasiKode(kode) {
    return String(kode || "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");
}

function normalisasiRole(role) {
    return normalisasiKode(role);
}

function normalisasiArray(data) {

    if (Array.isArray(data)) {
        return data
            .filter(item => item !== null && item !== undefined)
            .map(item => normalisasiKode(item))
            .filter(Boolean);
    }

    if (typeof data === "string" && data.trim() !== "") {
        return data
            .split(",")
            .map(item => normalisasiKode(item))
            .filter(Boolean);
    }

    return [];
}

function nilaiString(value) {
    return String(value || "").trim();
}

function nikPengguna() {
    return nilaiString(
        penggunaAktif?.nik ||
        penggunaAktif?.NIK ||
        penggunaAktif?.nomor_induk ||
        ""
    );
}


// =====================================
// 8. MEMBUAT KARTU MENU
// =====================================

function buatKartu(menu) {

    const kartu = document.createElement("div");
    kartu.className = "menu-card";

    const isi = document.createElement("div");
    isi.className = "menu-content";

    const iconBox = document.createElement("div");
    iconBox.className = "menu-icon-box";

    const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
    );

    svg.setAttribute("viewBox", "0 0 24 24");

    svg.innerHTML =
        ikonMenu[menu.kode] ||
        ikonMenu.default;

    iconBox.appendChild(svg);

    const teks = document.createElement("div");
    teks.className = "menu-text";

    const nama = document.createElement("strong");
    nama.textContent = menu.nama || "Menu";

    const deskripsi = document.createElement("small");
    deskripsi.textContent = menu.deskripsi || "";

    teks.appendChild(nama);
    teks.appendChild(deskripsi);

    const panah = document.createElement("div");
    panah.className = "arrow";
    panah.textContent = "›";

    isi.appendChild(iconBox);
    isi.appendChild(teks);
    isi.appendChild(panah);

    kartu.appendChild(isi);

    kartu.addEventListener("click", () => {

        if (!akunSiap) return;

        const halaman = String(
            menu.halaman || ""
        ).trim();

        if (!/^[a-zA-Z0-9_-]+\.html$/.test(halaman)) {

            alert(
                "Alamat halaman menu tidak valid.\n\n" +
                "Kode menu: " + menu.kode
            );

            return;
        }

        window.location.href = halaman;
    });

    return kartu;
}

// =====================================
// 10. MEMUAT KONFIGURASI MENU UMUM
// =====================================

async function muatKonfigurasiMenuUmum() {

    const hasil = [...MENU_UMUM_DEFAULT];

    try {

        const snapshot = await getDocs(
            collection(db, "menu_utama")
        );

        const konfigurasi = {};

        snapshot.forEach(dokumen => {

            const data = dokumen.data();

            const kode = normalisasiKode(
                data.kode || dokumen.id
            );

            konfigurasi[kode] = {
                id: dokumen.id,
                ...data,
                kode
            };
        });

        return hasil.map(menuDefault => {

            const dataFirestore =
                konfigurasi[menuDefault.kode] || {};

            return {
                ...menuDefault,
                ...dataFirestore,
                kode: menuDefault.kode,
                aktif: true
            };
        });

    } catch (error) {

        console.warn(
            "Konfigurasi menu_utama gagal dibaca.",
            error
        );

        return hasil;
    }
}


// =====================================
// 11. MEMUAT MENU KHUSUS SUPER ADMIN
// =====================================

async function muatMenuAdmin() {

    if (!superAdmin) {
        return [];
    }

    try {

        const snapshot = await getDocs(
            collection(db, "menu_utama")
        );

        const hasil = [];

        snapshot.forEach(dokumen => {

            const data = dokumen.data();

            const menu = {
                id: dokumen.id,
                ...data,
                kode: normalisasiKode(
                    data.kode || dokumen.id
                )
            };

            if (menu.aktif !== true) {
                return;
            }

            // Menu pengelolaan menu tugas
            // dibuat khusus oleh sistem.
            // Tidak perlu mengambil duplikat dari Firestore.

            if (menu.kode === "pengelolaan_menu_tugas") {
                return;
            }

            const role = normalisasiArray(
                menu.akses_role
            );

            const termasukMenuAdmin =
                MENU_ADMIN.includes(menu.kode) ||
                role.includes("super_admin");

            if (termasukMenuAdmin) {
                hasil.push(menu);
            }
        });

        hasil.sort((a, b) =>
            Number(a.urutan || 999) -
            Number(b.urutan || 999)
        );

        return hasil;

    } catch (error) {

        console.warn(
            "Gagal memuat menu admin:",
            error
        );

        return [];
    }
}


// =====================================
// 12. MEMERIKSA PENUGASAN NIK
// =====================================

function penugasanCocokDenganNIK(data) {

    const nik = nikPengguna();

    if (!nik) {
        return false;
    }

    const kandidatNIK = [

        data.nik,
        data.NIK,
        data.nomor_induk,
        data.target_nik,
        data.nik_karyawan,
        data.nik_penerima,
        data.karyawan_nik,

        data.pemegang_tugas_nik,
        data.pemegang_nik

    ];

    return kandidatNIK.some(value => {

        if (value === undefined || value === null) {
            return false;
        }

        return String(value).trim() === nik;
    });
}


function penugasanAktif(data) {

    if (data.aktif === false) {
        return false;
    }

    const status = normalisasiKode(
        data.status || "aktif"
    );

    const statusTidakAktif = [

        "nonaktif",
        "tidak_aktif",
        "dicabut",
        "berakhir",
        "selesai",
        "inactive",
        "disabled"

    ];

    return !statusTidakAktif.includes(status);
}


// =====================================
// 13. MEMBACA PENUGASAN KARYAWAN
// =====================================

async function muatPenugasanKaryawan() {

    const snapshot = await getDocs(
        collection(db, "penugasan_karyawan")
    );

    const penugasan = [];

    snapshot.forEach(dokumen => {

        const data = dokumen.data();

        if (!penugasanAktif(data)) {
            return;
        }

        if (superAdmin) {

            penugasan.push({
                id: dokumen.id,
                ...data
            });

            return;
        }

        if (penugasanCocokDenganNIK(data)) {

            penugasan.push({
                id: dokumen.id,
                ...data
            });
        }
    });

    return penugasan;
}


// =====================================
// 14. REFERENSI MENU DALAM PENUGASAN
// =====================================

function ambilReferensiMenuPenugasan(data) {

    const referensi = [

        data.menu_id,
        data.menuId,
        data.menu_kode,
        data.kode_menu,
        data.kode,
        data.tugas_id,
        data.tugas_kode

    ];

    const hasil = [];

    referensi.forEach(value => {

        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {
            hasil.push(normalisasiKode(value));
        }
    });

    return hasil;
}


// =====================================
// 15. MEMUAT MENU TUGAS DINAMIS
// =====================================

async function muatMenuTugasDinamis() {

    const snapshotMenu = await getDocs(
        collection(db, "menu_tugas")
    );

    const semuaMenuTugas = [];

    snapshotMenu.forEach(dokumen => {

        const data = dokumen.data();

        semuaMenuTugas.push({

            id: dokumen.id,
            ...data,

            kode: normalisasiKode(
                data.kode || dokumen.id
            )

        });
    });

    const menuAktif = semuaMenuTugas.filter(
        menu => menu.aktif === true
    );

    const penugasan = await muatPenugasanKaryawan();

    // Super Admin melihat daftar menu tugas aktif.

    if (superAdmin) {

        return menuAktif.sort((a, b) =>
            Number(a.urutan || 999) -
            Number(b.urutan || 999)
        );
    }

    // Karyawan hanya melihat menu yang ditugaskan.

    const menuYangDitugaskan = [];

    menuAktif.forEach(menu => {

        const idMenu = normalisasiKode(menu.id);
        const kodeMenu = normalisasiKode(menu.kode);

        const ditugaskan = penugasan.some(tugas => {

            const referensi =
                ambilReferensiMenuPenugasan(tugas);

            return (
                referensi.includes(idMenu) ||
                referensi.includes(kodeMenu)
            );
        });

        if (ditugaskan) {
            menuYangDitugaskan.push(menu);
        }
    });

    menuYangDitugaskan.sort((a, b) =>
        Number(a.urutan || 999) -
        Number(b.urutan || 999)
    );

    return menuYangDitugaskan;
}


// =====================================
// 16. MEMUAT INFORMASI DAN BANTUAN
// =====================================

async function muatMenuInformasi() {

    try {

        const snapshot = await getDocs(
            collection(db, "menu_utama")
        );

        const hasil = [];

        snapshot.forEach(dokumen => {

            const data = dokumen.data();

            const menu = {

                id: dokumen.id,
                ...data,

                kode: normalisasiKode(
                    data.kode || dokumen.id
                )

            };

            if (menu.aktif !== true) {
                return;
            }

            if (
                menu.kode === "informasi" ||
                menu.kode === "bantuan"
            ) {
                hasil.push(menu);
            }
        });

        hasil.sort((a, b) =>
            Number(a.urutan || 999) -
            Number(b.urutan || 999)
        );

        return hasil;

    } catch (error) {

        console.warn(
            "Menu informasi tidak dapat dimuat:",
            error
        );

        return [];
    }
}


// =====================================
// 17. MENAMPILKAN KARTU MENU
// =====================================

function tampilkanKartuMenu(daftarMenu, area) {

    area.replaceChildren();

    daftarMenu.forEach(menu => {

        const kartu = buatKartu(menu);

        area.appendChild(kartu);
    });
}


// =====================================
// 18. MENAMPILKAN MENU UTAMA
// =====================================

async function muatMenuFirestore() {

    const status = document.getElementById(
        "status-pemuatan"
    );

    try {

        const menuUmum =
            await muatKonfigurasiMenuUmum();

        let menuTugas = [];

        try {

            menuTugas =
                await muatMenuTugasDinamis();

        } catch (error) {

            console.error(
                "Menu tugas gagal dimuat:",
                error
            );
        }

        const menuInformasi =
            await muatMenuInformasi();

        const menuAdmin =
            await muatMenuAdmin();

        const areaProfil =
            document.getElementById("area-profil");

        const areaUmum =
            document.getElementById("area-menu-umum");

        const areaTugas =
            document.getElementById("daftar-menu-tugas");

        const areaMenuTugas =
            document.getElementById("area-menu-tugas");

        const areaBawah =
            document.getElementById("area-menu-bawah");

        const areaAdmin =
            document.getElementById("area-menu-admin");

        const areaPengelolaan =
            document.getElementById(
                "area-pengelolaan-menu-tugas"
            );

        areaProfil.replaceChildren();
        areaUmum.replaceChildren();
        areaTugas.replaceChildren();
        areaBawah.replaceChildren();
        areaAdmin.replaceChildren();
        areaPengelolaan.replaceChildren();


        // =================================
        // PROFIL
        // =================================

        const menuProfil = menuUmum.find(
            menu => menu.kode === "profil"
        );

        if (menuProfil) {

            const kartuProfil =
                buatKartu(menuProfil);

            kartuProfil.classList.add("menu-profil");

            areaProfil.appendChild(kartuProfil);
        }


        // =================================
        // EMPAT MENU UMUM LAINNYA
        // =================================

        const menuEmpat = menuUmum.filter(
            menu => [

                "pengajuan_cuti",
                "saldo_cuti",
                "riwayat_absensi",
                "riwayat_cuti"

            ].includes(menu.kode)
        );

        tampilkanKartuMenu(
            menuEmpat,
            areaUmum
        );


        // =================================
        // MENU TUGAS DINAMIS
        // =================================

        tampilkanKartuMenu(
            menuTugas,
            areaTugas
        );

        areaMenuTugas.classList.toggle(
            "tampil",
            menuTugas.length > 0
        );


        // =================================
        // INFORMASI DAN BANTUAN
        // =================================

        menuInformasi.forEach(menu => {

            const kartu = buatKartu(menu);

            kartu.classList.add("menu-bawah");

            areaBawah.appendChild(kartu);
        });


        // =================================
        // MENU SUPER ADMIN
        // =================================

        if (superAdmin) {

            // Tombol ini selalu tampil
            // untuk akun Super Admin.

            const kartuPengelolaan =
                buatMenuPengelolaanMenuTugas();

            areaPengelolaan.appendChild(
                kartuPengelolaan
            );

            // Menu admin lainnya tetap dari Firestore.

            tampilkanKartuMenu(
                menuAdmin,
                areaAdmin
            );

            document.getElementById(
                "area-admin"
            ).style.display = "block";

        } else {

            document.getElementById(
                "area-admin"
            ).style.display = "none";
        }


        // =================================
        // TAMPILKAN HALAMAN
        // =================================

        document.getElementById(
            "menu-container"
        ).classList.add("siap");

        akunSiap = true;

        status.style.display = "none";


        // =================================
        // DIAGNOSTIK
        // =================================

        console.log("========== WAINI MENU ==========");

        console.log("NIK:", nikPengguna());

        console.log("Role:", rolePengguna);

        console.log("Super Admin:", superAdmin);

        console.log(
            "Menu umum:",
            menuUmum.map(m => m.kode)
        );

        console.log(
            "Menu tugas:",
            menuTugas.map(m => m.kode)
        );

        console.log(
            "Menu admin:",
            menuAdmin.map(m => m.kode)
        );

        console.log(
            "Pengelolaan Menu Tugas:",
            superAdmin ? "Aktif" : "Tidak ditampilkan"
        );

    } catch (error) {

        console.error(
            "Gagal memuat menu WAINI:",
            error
        );

        status.style.display = "block";

        status.textContent =
            "Gagal memuat menu. Periksa koneksi internet dan Rules Firestore. " +
            (error.code || error.message);

        // Menu umum tetap ditampilkan.

        const menuFallback = MENU_UMUM_DEFAULT;

        const areaProfil =
            document.getElementById("area-profil");

        const areaUmum =
            document.getElementById("area-menu-umum");

        areaProfil.replaceChildren();
        areaUmum.replaceChildren();

        const profil = menuFallback.find(
            menu => menu.kode === "profil"
        );

        if (profil) {

            const kartuProfil =
                buatKartu(profil);

            kartuProfil.classList.add("menu-profil");

            areaProfil.appendChild(kartuProfil);
        }

        tampilkanKartuMenu(
            menuFallback.filter(
                menu => menu.kode !== "profil"
            ),
            areaUmum
        );

        // Jika akun sudah diketahui sebagai Super Admin,
        // tombol pengelolaan tetap ditampilkan.

        if (superAdmin) {

            const areaPengelolaan =
                document.getElementById(
                    "area-pengelolaan-menu-tugas"
                );

            areaPengelolaan.replaceChildren();

            areaPengelolaan.appendChild(
                buatMenuPengelolaanMenuTugas()
            );

            document.getElementById(
                "area-admin"
            ).style.display = "block";
        }

        document.getElementById(
            "menu-container"
        ).classList.add("siap");

        akunSiap = true;
    }
}


// =====================================
// 19. MEMERIKSA DATA PENGGUNA
// =====================================

async function periksaPengguna(user) {

    const status = document.getElementById(
        "status-pemuatan"
    );

    try {

        const referensi = doc(
            db,
            "pengguna",
            user.uid
        );

        const hasil = await getDoc(referensi);

        if (!hasil.exists()) {

            alert(
                "Data pengguna tidak ditemukan. Hubungi Super Admin."
            );

            await signOut(auth);

            window.location.replace("index.html");

            return;
        }

        const data = hasil.data();

        // Periksa status akun.

        if (
            String(data.status || "")
                .trim()
                .toLowerCase() !== "aktif"
        ) {

            alert(
                "Akun belum aktif. Silakan hubungi Super Admin."
            );

            await signOut(auth);

            window.location.replace("index.html");

            return;
        }

        penggunaAktif = data;

        rolePengguna = normalisasiRole(data.role);

        hakAksesPengguna = normalisasiArray(
            data.hak_akses
        );

        superAdmin =
            rolePengguna === "super_admin";


        // Salam pengguna.

        const nama =
            data.nama ||
            data.nik ||
            "Pengguna";

        const jabatan =
            data.jabatan ||
            "Anggota Divisi";

        document.getElementById(
            "salam-pengguna"
        ).textContent =
            "Selamat datang, " +
            nama +
            " • " +
            jabatan;


        // Diagnostik.

        console.log("========== AKUN WAINI ==========");

        console.log("Nama:", nama);

        console.log("Role:", rolePengguna);

        console.log("Status:", data.status);

        console.log("NIK:", nikPengguna());

        console.log("Hak akses:", hakAksesPengguna);

        console.log("Super Admin:", superAdmin);


        // Muat menu.

        await muatMenuFirestore();

    } catch (error) {

        console.error(
            "Kesalahan pemeriksaan pengguna:",
            error
        );

        status.style.display = "block";

        status.textContent =
            "Gagal memeriksa akun. " +
            (error.code || error.message);
    }
}


// =====================================
// 20. PEMERIKSAAN LOGIN
// =====================================

onAuthStateChanged(
    auth,
    async user => {

        akunSiap = false;

        if (!user) {

            window.location.replace("index.html");

            return;
        }

        await periksaPengguna(user);
    }
);


// =====================================
// 21. LOGOUT
// =====================================

window.bukaMenu = async function() {

    if (!akunSiap) return;

    const konfirmasi = confirm(
        "WAINI - Portal Anggota Divisi\n\n" +
        "Apakah Anda ingin keluar dari akun?"
    );

    if (!konfirmasi) return;

    try {

        await signOut(auth);

        window.location.replace("index.html");

    } catch (error) {

        console.error("Logout gagal:", error);

        alert(
            "Gagal keluar. Silakan coba kembali."
        );
    }
};
