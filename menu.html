
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#991b1b">
<title>Menu Utama - WAINI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

/* HEADER */

.header {
    background: #991b1b;
    color: white;
    padding: 18px 16px 23px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 22px;
}

.logo {
    width: 40px;
    height: 40px;
    background: white;
    color: #991b1b;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.brand-info {
    flex: 1;
}

.brand-info strong {
    font-size: 17px;
}

.brand-info small {
    display: block;
    color: #fecaca;
    font-size: 11px;
    margin-top: 3px;
}

.menu-icon {
    font-size: 23px;
    cursor: pointer;
    background: none;
    border: none;
    color: white;
}

.header h1 {
    font-size: 23px;
    margin-bottom: 7px;
}

.header p {
    color: #fee2e2;
    font-size: 12px;
    line-height: 1.5;
}

/* CONTAINER */

.container {
    max-width: 550px;
    padding: 18px 15px;
    margin: auto;
    display: none;
}

.container.siap {
    display: block;
}

/* KARTU MENU */

.menu-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 11px;
    padding: 13px;
    cursor: pointer;
    transition: .15s;
}

.menu-card:active {
    transform: scale(.98);
}

.menu-card:hover {
    border-color: #d1d5db;
}

.menu-content {
    display: flex;
    align-items: center;
    gap: 10px;
}

.menu-icon-box {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 9px;
    background: #fee2e2;
    color: #991b1b;
    display: flex;
    justify-content: center;
    align-items: center;
}

.menu-icon-box svg {
    width: 23px;
    height: 23px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.menu-text {
    flex: 1;
    min-width: 0;
}

.menu-text strong {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
}

.menu-text small {
    display: block;
    color: #777;
    font-size: 11px;
    line-height: 1.5;
}

.arrow {
    color: #9ca3af;
    font-size: 23px;
}

/* MENU PROFIL */

.menu-profil {
    margin-bottom: 12px;
}

/* GRID */

.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

/* MENU BAWAH */

.menu-bawah {
    margin-top: 12px;
}

/* JUDUL MENU ADMIN */

.judul-kelompok {
    margin: 22px 0 11px;
    padding-bottom: 9px;
    border-bottom: 1px solid #e5e7eb;
}

.judul-kelompok strong {
    font-size: 12px;
    color: #991b1b;
    letter-spacing: .4px;
}

.judul-kelompok small {
    display: block;
    font-size: 10px;
    color: #888;
    margin-top: 4px;
}

/* FOOTER */

.footer {
    background: #991b1b;
    border-radius: 9px;
    padding: 15px;
    margin-top: 12px;
    text-align: center;
}

.footer strong {
    display: block;
    color: white;
    font-size: 13px;
    margin-bottom: 5px;
}

.footer small {
    display: block;
    color: #fecaca;
    font-size: 10px;
}

/* STATUS */

#status-pemuatan {
    max-width: 550px;
    margin: 20px auto;
    padding: 0 15px;
    color: #991b1b;
    font-size: 12px;
    text-align: center;
    line-height: 1.6;
}

/* RESPONSIVE */

@media (max-width: 360px) {

    .menu-grid {
        gap: 8px;
    }

    .menu-card {
        padding: 11px;
    }

    .menu-icon-box {
        width: 38px;
        height: 38px;
    }

    .menu-text strong {
        font-size: 12px;
    }

    .menu-text small {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <div class="brand">

        <div class="logo">♙</div>

        <div class="brand-info">
            <strong>WAINI</strong>
            <small>Portal Anggota Divisi</small>
        </div>

        <button
            class="menu-icon"
            type="button"
            onclick="bukaMenu()"
            aria-label="Keluar"
        >☰</button>

    </div>

    <h1>Menu Utama</h1>

    <p id="salam-pengguna">
        Memeriksa akun pengguna...
    </p>

</header>


<!-- STATUS PEMUATAN -->

<div id="status-pemuatan">
    Menghubungkan ke WAINI...
</div>


<!-- MENU -->

<main class="container" id="menu-container">

    <!-- PROFIL -->

    <div id="area-profil"></div>

    <!-- MENU UMUM -->

    <div id="area-menu-umum" class="menu-grid"></div>

    <!-- INFORMASI DAN BANTUAN -->

    <div id="area-menu-bawah"></div>

    <!-- MENU SUPER ADMIN -->

    <div id="area-admin" style="display:none;">

        <div class="judul-kelompok">

            <strong>MENU KHUSUS SUPER ADMIN</strong>

            <small>
                Pengelolaan dan pengaturan sistem WAINI
            </small>

        </div>

        <div id="area-menu-admin" class="menu-grid"></div>

    </div>

    <!-- FOOTER -->

    <div class="footer">

        <strong>WAINI</strong>

        <small>
            Portal Anggota Divisi • 2026
        </small>

    </div>

</main>


<!-- FIREBASE -->

<script type="module">

// =====================================
// 1. IMPORT FIREBASE
// =====================================

import { firebaseConfig } from "./firebase.js";

import {
    initializeApp,
    getApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// =====================================
// 2. KONEKSI FIREBASE
// =====================================

let app;

try {
    app = getApp();
} catch (error) {
    app = initializeApp(firebaseConfig);
}

const auth = getAuth(app);
const db = getFirestore(app);


// =====================================
// 3. VARIABEL PENGGUNA
// =====================================

let penggunaAktif = null;
let rolePengguna = "";
let hakAksesPengguna = [];
let superAdmin = false;
let akunSiap = false;


// =====================================
// 4. IKON MENU
// =====================================

const ikonMenu = {

    profil: `
    <circle cx="12" cy="8" r="4"></circle>
    <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
    `,

    pengajuan_cuti: `
    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
    <path d="M16 3v4"></path>
    <path d="M8 3v4"></path>
    <path d="M3 10h18"></path>
    <path d="M8 14h3"></path>
    `,

    saldo_cuti: `
    <rect x="3" y="4" width="18" height="17" rx="2"></rect>
    <path d="M7 2v4"></path>
    <path d="M17 2v4"></path>
    <path d="M3 9h18"></path>
    <path d="m9 15 2 2 4-4"></path>
    `,

    riwayat_absensi: `
    <rect x="3" y="4" width="18" height="17" rx="2"></rect>
    <path d="M7 2v4"></path>
    <path d="M17 2v4"></path>
    <path d="M3 9h18"></path>
    <path d="M8 13h2"></path>
    <path d="M8 17h2"></path>
    <path d="M14 13h2"></path>
    `,

    riwayat_cuti: `
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <path d="M14 2v6h6"></path>
    <path d="M8 13h8"></path>
    <path d="M8 17h8"></path>
    <path d="M8 9h2"></path>
    `,

    informasi: `
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
    <path d="M10 21h4"></path>
    `,

    bantuan: `
    <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-.9L3 21l1.9-5.5a8.5 8.5 0 1 1 16.1-4"></path>
    <path d="M9 10a3 3 0 0 1 6 0c0 2-3 2-3 4"></path>
    <path d="M12 17h.01"></path>
    `,

    data_karyawan: `
    <circle cx="9" cy="8" r="4"></circle>
    <path d="M2 21v-2a7 7 0 0 1 14 0v2"></path>
    <path d="M19 8v6"></path>
    <path d="M22 11h-6"></path>
    `,

    verifikasi_pendaftaran: `
    <path d="M9 12l2 2 4-4"></path>
    <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"></path>
    `,

    pengaturan_hak_akses: `
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-2.4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6.7v-2.4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.1h2.4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1V14h-.1a1.7 1.7 0 0 0-1.6 1z"></path>
    `,

    kelola_akun: `
    <circle cx="12" cy="8" r="4"></circle>
    <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
    <path d="M19 8h4"></path>
    `,

    pengaturan_sistem: `
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-2.4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H6.7v-2.4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.1h2.4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1V14h-.1a1.7 1.7 0 0 0-1.6 1z"></path>
    `

};


// =====================================
// 5. NORMALISASI ROLE
// =====================================

function normalisasiRole(role) {

    return String(role || "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

}


// =====================================
// 6. NORMALISASI HAK AKSES
// =====================================

function normalisasiArray(data) {

    if (!Array.isArray(data)) {
        return [];
    }

    return data.map(item =>
        String(item).trim().toLowerCase()
    );

}


// =====================================
// 7. MEMBUAT KARTU MENU
// =====================================

function buatKartu(menu) {

    const kartu = document.createElement("div");

    kartu.className = "menu-card";

    const isi = document.createElement("div");

    isi.className = "menu-content";

    const iconBox = document.createElement("div");

    iconBox.className = "menu-icon-box";

    const svg = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
    );

    svg.setAttribute("viewBox", "0 0 24 24");

    svg.innerHTML =
        ikonMenu[menu.kode] ||
        '<circle cx="12" cy="12" r="8"></circle>';

    iconBox.appendChild(svg);

    const teks = document.createElement("div");

    teks.className = "menu-text";

    const nama = document.createElement("strong");

    nama.textContent = menu.nama || "Menu";

    const deskripsi = document.createElement("small");

    deskripsi.textContent = menu.deskripsi || "";

    teks.appendChild(nama);
    teks.appendChild(deskripsi);

    const panah = document.createElement("div");

    panah.className = "arrow";

    panah.textContent = "›";

    isi.appendChild(iconBox);
    isi.appendChild(teks);
    isi.appendChild(panah);

    kartu.appendChild(isi);

    kartu.addEventListener("click", () => {

        if (!akunSiap) return;

        // Validasi alamat halaman

        const halaman = String(menu.halaman || "");

        if (!/^[a-zA-Z0-9_-]+\.html$/.test(halaman)) {

            alert("Alamat halaman menu tidak valid.");

            return;

        }

        window.location.href = halaman;

    });

    return kartu;

}


// =====================================
// 8. MEMERIKSA HAK AKSES MENU
// =====================================

function bolehLihatMenu(menu) {

    // Super Admin dapat melihat semua menu aktif

    if (superAdmin) {
        return true;
    }

    const aksesRole = normalisasiArray(
        menu.akses_role
    );

    // Role harus terdaftar pada menu

    if (!aksesRole.includes(rolePengguna)) {
        return false;
    }

    // Jika akun memiliki hak_akses,
    // periksa izin per menu juga.

    if (Array.isArray(penggunaAktif.hak_akses)) {

        return hakAksesPengguna.includes(menu.kode);

    }

    // Jika hak_akses belum dibuat,
    // gunakan akses_role dari dokumen menu.

    return true;

}


// =====================================
// 9. MENAMPILKAN SELURUH MENU FIRESTORE
// =====================================

async function muatMenuFirestore() {

    const status = document.getElementById(
        "status-pemuatan"
    );

    try {

        const snapshot = await getDocs(
            collection(db, "menu_utama")
        );

        const semuaMenu = [];

        snapshot.forEach((dokumen) => {

            const data = dokumen.data();

            semuaMenu.push({

                id: dokumen.id,

                ...data,

                // Jika kode belum ada, gunakan Document ID
                kode: data.kode || dokumen.id

            });

        });

        // Hanya menu aktif

        const menuAktif = semuaMenu.filter(menu =>
            menu.aktif === true
        );

        // Filter sesuai hak akses

        const menuTampil = menuAktif.filter(menu =>
            bolehLihatMenu(menu)
        );

        // Urutkan berdasarkan angka urutan

        menuTampil.sort((a, b) =>
            Number(a.urutan || 999) -
            Number(b.urutan || 999)
        );


        // Bersihkan area sebelumnya

        const areaProfil = document.getElementById(
            "area-profil"
        );

        const areaUmum = document.getElementById(
            "area-menu-umum"
        );

        const areaBawah = document.getElementById(
            "area-menu-bawah"
        );

        const areaAdmin = document.getElementById(
            "area-menu-admin"
        );

        areaProfil.replaceChildren();
        areaUmum.replaceChildren();
        areaBawah.replaceChildren();
        areaAdmin.replaceChildren();


        // Kelompok menu

        menuTampil.forEach(menu => {

            const kartu = buatKartu(menu);

            // Profil: kartu lebar

            if (menu.kode === "profil") {

                kartu.classList.add("menu-profil");

                areaProfil.appendChild(kartu);

            }

            // Informasi dan bantuan: kartu lebar

            else if (
                menu.kode === "informasi" ||
                menu.kode === "bantuan"
            ) {

                kartu.classList.add("menu-bawah");

                areaBawah.appendChild(kartu);

            }

            // Menu khusus Super Admin

            else if (
                [
                    "data_karyawan",
                    "verifikasi_pendaftaran",
                    "pengaturan_hak_akses",
                    "kelola_akun",
                    "pengaturan_sistem"
                ].includes(menu.kode)
            ) {

                areaAdmin.appendChild(kartu);

            }

            // Menu umum lainnya

            else {

                areaUmum.appendChild(kartu);

            }

        });


        // Tampilkan bagian admin jika ada menu

        areaAdmin.parentElement.style.display =
            areaAdmin.children.length > 0
                ? "block"
                : "none";


        // Tampilkan halaman

        status.style.display = "none";

        document.getElementById(
            "menu-container"
        ).classList.add("siap");

        akunSiap = true;


        console.log(
            "Jumlah dokumen Firestore:",
            snapshot.size
        );

        console.log(
            "Jumlah menu aktif:",
            menuAktif.length
        );

        console.log(
            "Jumlah menu yang ditampilkan:",
            menuTampil.length
        );

        console.log(
            "Role pengguna:",
            rolePengguna
        );

        console.log(
            "Super Admin:",
            superAdmin
        );


        if (menuTampil.length === 0) {

            status.style.display = "block";

            status.textContent =
                "Belum ada menu yang dapat ditampilkan. Periksa pengaturan hak akses.";

        }

    } catch (error) {

        console.error(
            "Gagal membaca menu Firestore:",
            error
        );

        status.style.display = "block";

        status.textContent =
            "Gagal membaca menu dari Firestore. Periksa Firestore Rules dan koneksi internet. Kode: " +
            error.code;

    }

}


// =====================================
// 10. MEMERIKSA DATA PENGGUNA
// =====================================

async function periksaPengguna(user) {

    const status = document.getElementById(
        "status-pemuatan"
    );

    try {

        // Ambil data pengguna berdasarkan UID

        const referensi = doc(
            db,
            "pengguna",
            user.uid
        );

        const hasil = await getDoc(referensi);

        if (!hasil.exists()) {

            alert(
                "Data pengguna tidak ditemukan. Hubungi Super Admin."
            );

            await signOut(auth);

            window.location.replace("index.html");

            return;

        }

        const data = hasil.data();

        // Periksa status akun

        if (
            String(data.status || "").toLowerCase() !== "aktif"
        ) {

            alert(
                "Akun belum aktif. Silakan hubungi Super Admin."
            );

            await signOut(auth);

            window.location.replace("index.html");

            return;

        }


        // Simpan data

        penggunaAktif = data;

        rolePengguna = normalisasiRole(data.role);

        hakAksesPengguna = normalisasiArray(
            data.hak_akses
        );


        // IDENTIFIKASI SUPER ADMIN

        superAdmin = rolePengguna === "super_admin";


        // Tampilkan salam pengguna

        const nama = data.nama || data.nik || "Pengguna";

        const jabatan = data.jabatan || "Anggota Divisi";

        document.getElementById(
            "salam-pengguna"
        ).textContent =
            "Selamat datang, " + nama + " • " + jabatan;


        // Baca seluruh menu dari Firestore

        await muatMenuFirestore();


    } catch (error) {

        console.error(
            "Kesalahan pemeriksaan pengguna:",
            error
        );

        status.textContent =
            "Gagal memeriksa akun. Periksa koneksi Firebase dan Firestore Rules.";

    }

}


// =====================================
// 11. PEMERIKSAAN LOGIN
// =====================================

onAuthStateChanged(auth, async (user) => {

    akunSiap = false;

    if (!user) {

        window.location.replace("index.html");

        return;

    }

    await periksaPengguna(user);

});


// =====================================
// 12. LOGOUT
// =====================================

window.bukaMenu = async function() {

    if (!akunSiap) return;

    const konfirmasi = confirm(
        "WAINI - Portal Anggota Divisi\n\n" +
        "Apakah Anda ingin keluar dari akun?"
    );

    if (!konfirmasi) return;

    try {

        await signOut(auth);

        window.location.replace("index.html");

    } catch (error) {

        console.error("Logout gagal:", error);

        alert("Gagal keluar. Silakan coba kembali.");

    }

};

</script>

</body>
</html>
