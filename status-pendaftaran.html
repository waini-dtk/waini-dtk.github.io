
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#991b1b">
<title>Status Pendaftaran - WAINI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
    padding-bottom: 25px;
}

.header {
    background: #991b1b;
    color: white;
    padding: 18px 16px 23px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 22px;
}

.logo {
    width: 40px;
    height: 40px;
    border-radius: 9px;
    background: white;
    color: #991b1b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.brand-name {
    flex: 1;
    font-weight: bold;
    font-size: 17px;
}

.brand-name small {
    display: block;
    color: #fecaca;
    font-size: 11px;
    font-weight: normal;
    margin-top: 3px;
}

.online {
    background: #15803d;
    color: white;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
}

.header h1 {
    font-size: 24px;
    margin-bottom: 7px;
}

.header p {
    font-size: 12px;
    color: #fee2e2;
    line-height: 1.5;
}

.container {
    padding: 18px 15px;
    max-width: 550px;
    margin: auto;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 15px;
    font-weight: bold;
}

.latest {
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 10px;
    padding: 5px 9px;
    border-radius: 20px;
}

.person-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 11px;
}

.person-top {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 37px;
    height: 37px;
    border-radius: 50%;
    background: #f1f2f4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
}

.person-info {
    flex: 1;
    min-width: 0;
}

.person-info strong {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
    overflow-wrap: anywhere;
}

.person-info small {
    font-size: 11px;
    color: #777;
}

.status-icon {
    font-size: 21px;
    flex-shrink: 0;
}

.status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #eee;
}

.status-label {
    color: #777;
    font-size: 11px;
}

.status {
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
    text-align: center;
}

.waiting {
    background: #fef3c7;
    color: #92400e;
}

.approved {
    background: #dcfce7;
    color: #166534;
}

.rejected {
    background: #fee2e2;
    color: #991b1b;
}

.note {
    color: #888;
    font-size: 11px;
    line-height: 1.5;
    margin: 15px 2px;
}

.back-button {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 9px;
    color: #444;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.back-button:active {
    background: #eee;
}

.loading,
.empty,
.error-message {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 18px 14px;
    text-align: center;
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-bottom: 11px;
}

.error-message {
    background: #fee2e2;
    color: #991b1b;
    border-color: #fecaca;
}

.refresh-button {
    display: block;
    margin: 10px auto 0;
    border: none;
    background: #991b1b;
    color: white;
    border-radius: 7px;
    padding: 9px 14px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">

        <div class="logo">♙</div>

        <div class="brand-name">
            WAINI
            <small>Sistem Informasi Internal Divisi</small>
        </div>

        <div class="online">ONLINE</div>

    </div>

    <h1>Status Pendaftaran</h1>

    <p>
        Pantau perkembangan pendaftaran anggota divisi.
    </p>

</header>

<main class="container">

    <div class="card" style="background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:14px">
        <form id="formCariStatus">
            <label for="nikCari" style="display:block;font-size:12px;font-weight:bold;margin-bottom:7px">NIK yang didaftarkan</label>
            <input id="nikCari" type="text" autocomplete="off" required maxlength="30"
                placeholder="Masukkan NIK" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin-bottom:9px">
            <button type="submit" style="width:100%;padding:12px;background:#991b1b;color:white;border:0;border-radius:9px;font-weight:bold">Periksa Status</button>
        </form>
    </div>

    <div class="section-title">
        <span>Status Pendaftaran Anda</span>
        <span class="latest">Privat</span>
    </div>

    <div id="daftarPendaftar">

        <div class="loading">
            Memuat data pendaftaran...
        </div>

    </div>

    <p class="note" id="catatan">
        Masukkan NIK yang digunakan saat mendaftar. Halaman hanya menampilkan status pendaftaran yang cocok.
    </p>

    <button
        class="back-button"
        onclick="window.location.href='daftar.html'"
    >
        ← Kembali ke Halaman Pendaftaran
    </button>

</main>

<script type="module">
import { db } from "./firebase.js";
import {
  collection, query, where, getDocs, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const list = document.getElementById("daftarPendaftar");
const note = document.getElementById("catatan");
const form = document.getElementById("formCariStatus");
const nikInput = document.getElementById("nikCari");

function statusInfo(status) {
  const v = String(status || "").toLowerCase().trim();
  if (["aktif","disetujui","approved"].includes(v)) return {label:"Disetujui / Akun Aktif",cls:"approved",icon:"✓"};
  if (["ditolak","rejected"].includes(v)) return {label:"Ditolak",cls:"rejected",icon:"✕"};
  if (v==="perlu_melengkapi_data") return {label:"Perlu Melengkapi Data",cls:"waiting",icon:"!"};
  return {label:"Menunggu Verifikasi",cls:"waiting",icon:"◷"};
}
function safeText(el, text){ el.textContent=String(text??""); }
function showMessage(text, cls="empty"){
  list.innerHTML="";
  const div=document.createElement("div");
  div.className=cls;
  div.textContent=text;
  list.appendChild(div);
}
function renderResult(data){
  list.innerHTML="";
  const info=statusInfo(data.status);
  const card=document.createElement("div");
  card.className="person-card";
  const top=document.createElement("div");
  top.className="person-top";
  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent="♙";
  const detail=document.createElement("div");
  detail.className="person-info";
  const name=document.createElement("strong");
  name.textContent=data.nama||"Nama tidak tersedia";
  const date=document.createElement("small");
  date.textContent="Terdaftar: "+formatTanggal(data);
  detail.append(name,date);
  const icon=document.createElement("span");
  icon.className="status-icon";
  icon.textContent=info.icon;
  top.append(avatar,detail,icon);
  const row=document.createElement("div");
  row.className="status-row";
  const label=document.createElement("span");
  label.className="status-label";
  label.textContent="Status pendaftaran";
  const badge=document.createElement("span");
  badge.className="status "+info.cls;
  badge.textContent=info.label;
  row.append(label,badge);
  card.append(top,row);
  list.appendChild(card);
}
function formatTanggal(data){
  const v=data.createdAt;
  let d;
  if(v?.toDate) d=v.toDate();
  else if(v) d=new Date(v);
  if(!d||isNaN(d.getTime())) return "Tanggal tidak tersedia";
  return d.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
}
form.addEventListener("submit",async e=>{
  e.preventDefault();
  const nik=nikInput.value.trim().toUpperCase();
  if(!nik){showMessage("Masukkan NIK terlebih dahulu.");return;}
  showMessage("Memeriksa data pendaftaran...","loading");
  try{
    const q=query(collection(db,"pengguna"),where("nik","==",nik),limit(5));
    const snap=await getDocs(q);
    const found=snap.docs.find(d=>String(d.data().role||"").toLowerCase()==="karyawan");
    if(!found){showMessage("Data pendaftaran dengan NIK tersebut tidak ditemukan. Pastikan NIK benar.");return;}
    renderResult(found.data());
    note.textContent="Status ditampilkan berdasarkan NIK yang Anda masukkan. Jika data belum berubah, hubungi Super Admin.";
  }catch(err){
    console.error("Gagal memeriksa status:",err);
    showMessage("Status belum dapat diperiksa. Periksa koneksi internet atau akses Firebase.","error-message");
  }
});
</script>

</body>
</html>
