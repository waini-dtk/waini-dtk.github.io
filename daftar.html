
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendaftaran Karyawan - WAINI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.header {
    background: #991b1b;
    color: white;
    padding: 18px 16px 23px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 22px;
}

.logo {
    width: 40px;
    height: 40px;
    background: white;
    color: #991b1b;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.brand-info {
    flex: 1;
}

.brand-info strong {
    font-size: 17px;
}

.brand-info small {
    display: block;
    color: #fecaca;
    font-size: 11px;
    margin-top: 3px;
}

.menu-icon {
    font-size: 23px;
}

.header h1 {
    font-size: 23px;
    margin-bottom: 7px;
}

.header p {
    color: #fee2e2;
    font-size: 12px;
}

.container {
    max-width: 550px;
    padding: 18px 15px;
    margin: auto;
}

.form-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 16px;
}

.form-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 17px;
}

label {
    display: block;
    font-size: 11px;
    color: #666;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 12px;
    border: none;
    outline: none;
    background: #f1f2f4;
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 15px;
}

input:focus {
    box-shadow: 0 0 0 1px #991b1b;
}

.submit-button {
    width: 100%;
    padding: 13px;
    background: #991b1b;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 13px;
    font-weight: bold;
    opacity: .5;
    cursor: not-allowed;
}

.submit-button:not(:disabled) {
    opacity: 1;
    cursor: pointer;
}

.submit-button:not(:disabled):active {
    background: #7f1d1d;
}

.submit-button:disabled {
    cursor: not-allowed;
}

.divider {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 19px 0;
}

.info-card {
    background: white;
    border: 1px solid #16a34a;
    border-radius: 11px;
    padding: 13px;
}

.info-content {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 13px;
}

.info-icon {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 9px;
    background: #dcfce7;
    color: #15803d;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
}

.info-text {
    flex: 1;
}

.info-text strong {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
}

.info-text small {
    display: block;
    color: #777;
    font-size: 11px;
    line-height: 1.5;
}

.arrow {
    color: #16a34a;
    font-size: 23px;
}

.info-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #16a34a;
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.info-button:active {
    background: #15803d;
}

/* PESAN SISTEM */

.pesan {
    display: none;
    padding: 11px;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 14px;
}

.pesan.sukses {
    display: block;
    color: #166534;
    background: #dcfce7;
    border: 1px solid #86efac;
}

.pesan.error {
    display: block;
    color: #991b1b;
    background: #fee2e2;
    border: 1px solid #fecaca;
}

.pesan.proses {
    display: block;
    color: #854d0e;
    background: #fef9c3;
    border: 1px solid #fde047;
}

.catatan {
    font-size: 10px;
    color: #888;
    margin-top: -9px;
    margin-bottom: 14px;
    line-height: 1.5;
}
</style>
</head>

<body>

<header class="header">
    <div class="brand">
        <div class="logo">♙</div>
        <div class="brand-info">
            <strong>WAINI</strong>
            <small>Pendaftaran Anggota Divisi</small>
        </div>
        <div class="menu-icon">☰</div>
    </div>

    <h1>Pendaftaran Karyawan</h1>
    <p>Silakan lengkapi formulir pendaftaran Anda.</p>
</header>

<main class="container">

    <div class="form-card">
        <div class="form-title">
            Formulir Pendaftaran
        </div>

        <form id="formPendaftaran">

            <label>NIK</label>
            <input
                type="text"
                id="nik"
                placeholder="Masukkan NIK karyawan"
                maxlength="30"
                autocomplete="off"
                autocapitalize="characters"
                required
            >

            <div class="catatan">
                NIK menggunakan huruf dan angka tanpa spasi atau simbol.
            </div>

            <label>Nama Lengkap</label>
            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama lengkap"
                maxlength="100"
                autocomplete="name"
                required
            >

            <label>Jabatan</label>
            <input
                type="text"
                id="jabatan"
                placeholder="Masukkan jabatan"
                maxlength="100"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Buat password minimal 6 karakter"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <label>Konfirmasi Password</label>
            <input
                type="password"
                id="konfirmasiPassword"
                placeholder="Ulangi password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <div id="pesan" class="pesan"></div>

            <button
                type="submit"
                class="submit-button"
                id="tombolDaftar"
                disabled
            >
                Daftar Sekarang
            </button>

        </form>
    </div>

    <hr class="divider">

    <div class="info-card">
        <div class="info-content">
            <div class="info-icon">☷</div>

            <div class="info-text">
                <strong>
                    Informasi Pendaftaran Terbaru
                </strong>

                <small>
                    Lihat perkembangan pendaftaran anggota divisi.
                </small>
            </div>

            <div class="arrow">›</div>
        </div>

        <button
            class="info-button"
            onclick="window.location.href='status-pendaftaran.html'"
        >
            Lihat Status Pendaftaran →
        </button>
    </div>

</main>

<script type="module">

import { firebaseConfig } from "./firebase.js";

import {
    initializeApp,
    getApps,
    getApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signOut,
    deleteUser
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    writeBatch,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// =====================================
// 1. HUBUNGKAN FIREBASE
// =====================================

const app = getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

// =====================================
// 2. PENGATURAN KOLEKSI
// =====================================

const KOLEKSI_PENGGUNA = "pengguna";
const KOLEKSI_PUBLIK = "status_pendaftaran_public";

// =====================================
// 3. IDENTITAS SUPER ADMIN
// =====================================

const NIK_SUPER_ADMIN = "28B03150560";

// =====================================
// 4. ELEMEN FORM
// =====================================

const form = document.getElementById("formPendaftaran");
const nikInput = document.getElementById("nik");
const namaInput = document.getElementById("nama");
const jabatanInput = document.getElementById("jabatan");
const passwordInput = document.getElementById("password");
const konfirmasiInput = document.getElementById("konfirmasiPassword");
const tombolDaftar = document.getElementById("tombolDaftar");
const pesan = document.getElementById("pesan");

// =====================================
// 5. FORMAT NIK
// =====================================

nikInput.addEventListener("input", () => {
    const posisi = nikInput.selectionStart;

    nikInput.value = nikInput.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

    const posisiBaru = Math.min(
        posisi,
        nikInput.value.length
    );

    try {
        nikInput.setSelectionRange(posisiBaru, posisiBaru);
    } catch (error) {
        // Tidak perlu tindakan.
    }

    periksaForm();
});

// =====================================
// 6. VALIDASI FORM
// =====================================

function periksaForm() {
    const nik = nikInput.value.trim().toUpperCase();
    const nama = namaInput.value.trim();
    const jabatan = jabatanInput.value.trim();
    const password = passwordInput.value;
    const konfirmasi = konfirmasiInput.value;

    const nikValid = /^[A-Z0-9]{5,30}$/.test(nik);

    // NIK Super Admin tidak boleh didaftarkan sebagai karyawan.
    const bukanSuperAdmin = nik !== NIK_SUPER_ADMIN;

    const namaValid = nama.length >= 2;
    const jabatanValid = jabatan.length >= 2;
    const passwordValid = password.length >= 6;
    const passwordSama = password === konfirmasi;

    tombolDaftar.disabled = !(
        nikValid &&
        bukanSuperAdmin &&
        namaValid &&
        jabatanValid &&
        passwordValid &&
        passwordSama
    );
}

// Pantau perubahan input.
[
    namaInput,
    jabatanInput,
    passwordInput,
    konfirmasiInput
].forEach(input => {
    input.addEventListener("input", periksaForm);
});

// =====================================
// 7. TAMPILKAN PESAN
// =====================================

function tampilPesan(teks, jenis) {
    pesan.textContent = teks;
    pesan.className = "pesan " + jenis;
}

// =====================================
// 8. TERJEMAHKAN ERROR FIREBASE
// =====================================

function terjemahkanError(error) {
    const kode = error.code || "";

    const daftarError = {
        "auth/email-already-in-use":
            "NIK ini sudah terdaftar. Silakan gunakan NIK lain.",

        "auth/invalid-email":
            "Format NIK tidak dapat digunakan sebagai identitas login.",

        "auth/weak-password":
            "Password terlalu lemah. Gunakan minimal 6 karakter.",

        "auth/network-request-failed":
            "Koneksi internet bermasalah. Silakan coba kembali.",

        "auth/too-many-requests":
            "Terlalu banyak percobaan. Silakan coba beberapa saat lagi.",

        "auth/operation-not-allowed":
            "Metode pendaftaran Email/Password belum diaktifkan di Firebase Authentication.",

        "permission-denied":
            "Penyimpanan ditolak oleh aturan keamanan Firebase.",

        "firestore/permission-denied":
            "Akses Firestore ditolak. Periksa Rules Firebase.",

        "unavailable":
            "Server Firebase sedang tidak tersedia. Coba kembali.",

        "resource-exhausted":
            "Batas penggunaan Firebase tercapai. Silakan coba kembali nanti."
    };

    if (daftarError[kode]) {
        return daftarError[kode];
    }

    if (
        error.message?.includes(
            "Missing or insufficient permissions"
        )
    ) {
        return "Akses Firestore ditolak. Periksa Rules Firebase.";
    }

    return "Pendaftaran gagal. Silakan periksa koneksi dan coba kembali.";
}

// =====================================
// 9. PROSES PENDAFTARAN
// =====================================

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (tombolDaftar.disabled) return;

    const nik = nikInput.value.trim().toUpperCase();
    const nama = namaInput.value.trim();
    const jabatan = jabatanInput.value.trim();
    const password = passwordInput.value;
    const konfirmasi = konfirmasiInput.value;

    // =================================
    // 10. VALIDASI NIK
    // =================================

    if (!/^[A-Z0-9]{5,30}$/.test(nik)) {
        tampilPesan(
            "NIK harus terdiri dari 5 sampai 30 karakter huruf atau angka.",
            "error"
        );
        return;
    }

    if (nik === NIK_SUPER_ADMIN) {
        tampilPesan(
            "NIK tersebut merupakan NIK Super Admin dan tidak dapat didaftarkan melalui formulir karyawan.",
            "error"
        );
        return;
    }

    // =================================
    // 11. VALIDASI DATA
    // =================================

    if (nama.length < 2) {
        tampilPesan("Nama lengkap minimal 2 karakter.", "error");
        return;
    }

    if (jabatan.length < 2) {
        tampilPesan("Jabatan minimal 2 karakter.", "error");
        return;
    }

    if (password.length < 6) {
        tampilPesan("Password minimal terdiri dari 6 karakter.", "error");
        return;
    }

    if (password !== konfirmasi) {
        tampilPesan("Konfirmasi password tidak sama.", "error");
        return;
    }

    // =================================
    // 12. MULAI PROSES
    // =================================

    tombolDaftar.disabled = true;
    tombolDaftar.textContent = "Memproses Pendaftaran...";

    tampilPesan(
        "Sedang memproses pendaftaran. Mohon tunggu dan jangan menutup halaman.",
        "proses"
    );

    let userBaru = null;
    let dataBerhasilTersimpan = false;

    try {

        // =================================
        // 13. EMAIL INTERNAL BERDASARKAN NIK
        // =================================

        const emailInternal =
            nik.toLowerCase() + "@waini-dtk.invalid";

        // =================================
        // 14. BUAT AKUN FIREBASE AUTH
        // =================================

        const hasilAuth = await createUserWithEmailAndPassword(
            auth,
            emailInternal,
            password
        );

        userBaru = hasilAuth.user;

        // =================================
        // 15. SIAPKAN BATCH FIRESTORE
        // =================================

        const batch = writeBatch(db);

        // =================================
        // 16. DATA PRIVAT PENGGUNA
        // =================================

        const referensiPengguna = doc(
            db,
            KOLEKSI_PENGGUNA,
            userBaru.uid
        );

        batch.set(referensiPengguna, {
            uid: userBaru.uid,
            nik: nik,
            nama: nama,
            jabatan: jabatan,
            role: "karyawan",
            status: "menunggu_verifikasi",
            hak_akses: [],
            createdAt: serverTimestamp()
        });

        // =================================
        // 17. DATA PUBLIK PENDAFTARAN
        // =================================

        const referensiPublik = doc(
            db,
            KOLEKSI_PUBLIK,
            userBaru.uid
        );

        batch.set(referensiPublik, {
            nama: nama,
            status: "Menunggu Verifikasi",
            createdAt: serverTimestamp()
        });

        // =================================
        // 18. SIMPAN DATA
        // =================================

        await batch.commit();
        dataBerhasilTersimpan = true;

        // =================================
        // 19. KELUARKAN AKUN DARI SESI
        // =================================

        try {
            await signOut(auth);
        } catch (errorLogout) {
            console.error("Logout otomatis gagal:", errorLogout);
        }

        // =================================
        // 20. PENDAFTARAN BERHASIL
        // =================================

        tampilPesan(
            "Pendaftaran berhasil! Data Anda telah tersimpan dan sedang menunggu verifikasi admin. Silakan lihat perkembangan melalui menu Informasi Pendaftaran Terbaru.",
            "sukses"
        );

        form.reset();
        periksaForm();

        tombolDaftar.textContent = "Daftar Sekarang";
        tombolDaftar.disabled = true;

    } catch (error) {

        console.error("Kesalahan pendaftaran:", error);

        // =================================
        // 21. HAPUS AKUN AUTH JIKA SIMPAN DATA GAGAL
        // =================================

        if (userBaru && !dataBerhasilTersimpan) {

            try {
                await deleteUser(userBaru);

                console.log(
                    "Akun Auth sementara berhasil dihapus."
                );

            } catch (hapusError) {

                console.error(
                    "Penghapusan akun sementara gagal:",
                    hapusError
                );

                try {
                    await signOut(auth);
                } catch (logoutError) {
                    console.error("Logout gagal:", logoutError);
                }

                tampilPesan(
                    "Penyimpanan profil gagal dan akun sementara belum berhasil dihapus. Jangan mendaftar ulang menggunakan NIK ini. Hubungi administrator.",
                    "error"
                );

                tombolDaftar.textContent = "Daftar Sekarang";
                tombolDaftar.disabled = false;

                return;
            }
        }

        // =================================
        // 22. TAMPILKAN ERROR
        // =================================

        tampilPesan(terjemahkanError(error), "error");

        tombolDaftar.textContent = "Daftar Sekarang";
        tombolDaftar.disabled = false;
    }
});

// =====================================
// 23. PERIKSA FORM SAAT DIBUKA
// =====================================

periksaForm();

</script>

</body>
</html>
