<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#991b1b">
<title>Pendaftaran Karyawan - WAINI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.header {
    background: #991b1b;
    color: white;
    padding: 18px 16px 23px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 22px;
}

.logo {
    width: 40px;
    height: 40px;
    background: white;
    color: #991b1b;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.brand-info {
    flex: 1;
}

.brand-info strong {
    font-size: 17px;
}

.brand-info small {
    display: block;
    color: #fecaca;
    font-size: 11px;
    margin-top: 3px;
}

.menu-icon {
    font-size: 23px;
}

.header h1 {
    font-size: 23px;
    margin-bottom: 7px;
}

.header p {
    color: #fee2e2;
    font-size: 12px;
}

.container {
    max-width: 550px;
    padding: 18px 15px;
    margin: auto;
}

.form-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 16px;
}

.form-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 17px;
}

label {
    display: block;
    font-size: 11px;
    color: #666;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 12px;
    border: none;
    outline: none;
    background: #f1f2f4;
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 15px;
    transition: .25s;
}

input:focus {
    box-shadow: 0 0 0 1px #991b1b;
}

input:disabled {
    opacity: .6;
}

.submit-button {
    width: 100%;
    padding: 13px;
    background: #991b1b;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.submit-button:not(:disabled):active {
    background: #7f1d1d;
}

.submit-button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.divider {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 19px 0;
}

.info-card {
    background: white;
    border: 1px solid #16a34a;
    border-radius: 11px;
    padding: 13px;
}

.info-content {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 13px;
}

.info-icon {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 9px;
    background: #dcfce7;
    color: #15803d;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
}

.info-text {
    flex: 1;
}

.info-text strong {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
}

.info-text small {
    display: block;
    color: #777;
    font-size: 11px;
    line-height: 1.5;
}

.arrow {
    color: #16a34a;
    font-size: 23px;
}

.info-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #16a34a;
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.info-button:active {
    background: #15803d;
}

.pesan {
    display: none;
    padding: 11px;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 14px;
}

.pesan.sukses {
    display: block;
    color: #166534;
    background: #dcfce7;
    border: 1px solid #86efac;
}

.pesan.error {
    display: block;
    color: #991b1b;
    background: #fee2e2;
    border: 1px solid #fecaca;
}

.pesan.proses {
    display: block;
    color: #854d0e;
    background: #fef9c3;
    border: 1px solid #fde047;
}

.pesan.info {
    display: block;
    color: #1e40af;
    background: #dbeafe;
    border: 1px solid #93c5fd;
}

.catatan {
    font-size: 10px;
    color: #888;
    margin-top: -9px;
    margin-bottom: 14px;
    line-height: 1.5;
}

.hidden {
    display: none !important;
}

@media (max-width: 360px) {
    .header h1 {
        font-size: 21px;
    }

    .form-card {
        padding: 13px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">

        <div class="logo">♙</div>

        <div class="brand-info">
            <strong>WAINI</strong>
            <small>Pendaftaran Anggota Divisi</small>
        </div>

        <div class="menu-icon">☰</div>

    </div>

    <h1>Pendaftaran Karyawan</h1>

    <p>Silakan lengkapi formulir pendaftaran Anda.</p>

</header>

<main class="container">

    <div class="form-card">

        <div class="form-title">
            Formulir Pendaftaran
        </div>

        <form id="formPendaftaran">

            <label>NIK Karyawan</label>

            <input
                type="text"
                id="nik"
                placeholder="Masukkan NIK karyawan"
                maxlength="30"
                autocomplete="off"
                autocapitalize="characters"
                required
            >

            <div class="catatan">
                Masukkan NIK sesuai identitas Anda.
            </div>

            <label>Nama Lengkap</label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama lengkap"
                maxlength="100"
                autocomplete="name"
                required
            >

            <label>Jabatan</label>

            <input
                type="text"
                id="jabatan"
                placeholder="Masukkan jabatan"
                maxlength="100"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Buat password minimal 6 karakter"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <div class="catatan">
                Password minimal 6 karakter.
            </div>

            <label>Konfirmasi Password</label>

            <input
                type="password"
                id="konfirmasiPassword"
                placeholder="Ulangi password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <div id="pesan" class="pesan"></div>

            <button
                type="submit"
                class="submit-button"
                id="tombolDaftar"
            >
                Daftar Sekarang
            </button>

        </form>

    </div>

    <hr class="divider">

    <div class="info-card">

        <div class="info-content">

            <div class="info-icon">☷</div>

            <div class="info-text">

                <strong>
                    Informasi Pendaftaran Terbaru
                </strong>

                <small>
                    Lihat perkembangan pendaftaran anggota divisi.
                </small>

            </div>

            <div class="arrow">›</div>

        </div>

        <button
            class="info-button"
            onclick="window.location.href='status-pendaftaran.html'"
        >
            Lihat Status Pendaftaran →
        </button>

    </div>

</main>

<script type="module">

// =====================================
// 1. FIREBASE
// =====================================

import { firebaseConfig } from "./firebase.js";

import {
    initializeApp,
    getApps,
    getApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signOut,
    deleteUser
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    writeBatch,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

// =====================================
// 2. NAMA KOLEKSI
// =====================================

const KOLEKSI_PENGGUNA = "pengguna";

const KOLEKSI_STATUS_PUBLIK =
    "status_pendaftaran_public";

// =====================================
// 3. ELEMEN FORM
// =====================================

const form = document.getElementById(
    "formPendaftaran"
);

const nikInput = document.getElementById("nik");

const namaInput = document.getElementById("nama");

const jabatanInput = document.getElementById(
    "jabatan"
);

const passwordInput = document.getElementById(
    "password"
);

const konfirmasiInput = document.getElementById(
    "konfirmasiPassword"
);

const tombolDaftar = document.getElementById(
    "tombolDaftar"
);

const pesan = document.getElementById("pesan");

// =====================================
// 4. TAMPILKAN PESAN
// =====================================

function tampilPesan(teks, jenis) {

    pesan.textContent = teks;

    pesan.className = "pesan " + jenis;

}

function hapusPesan() {

    pesan.textContent = "";

    pesan.className = "pesan";

}

// =====================================
// 5. FORMAT NIK
// =====================================

nikInput.addEventListener("input", () => {

    nikInput.value = nikInput.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

    hapusPesan();

});

// =====================================
// 6. VALIDASI PASSWORD
// =====================================

konfirmasiInput.addEventListener("input", () => {

    hapusPesan();

});

passwordInput.addEventListener("input", () => {

    hapusPesan();

});

// =====================================
// 7. TERJEMAHAN ERROR FIREBASE
// =====================================

function terjemahkanError(error) {

    const kode = error.code || "";

    const daftarError = {

        "auth/email-already-in-use":
            "NIK ini sudah memiliki akun WAINI. Silakan masuk melalui halaman Login.",

        "auth/invalid-email":
            "Format identitas login tidak valid.",

        "auth/weak-password":
            "Password terlalu lemah. Gunakan minimal 6 karakter.",

        "auth/network-request-failed":
            "Koneksi internet bermasalah. Silakan coba kembali.",

        "auth/too-many-requests":
            "Terlalu banyak percobaan. Silakan coba beberapa saat lagi.",

        "auth/operation-not-allowed":
            "Firebase Authentication Email/Password belum diaktifkan.",

        "permission-denied":
            "Penyimpanan ditolak oleh aturan keamanan Firebase.",

        "auth/invalid-api-key":
            "Firebase API Key tidak valid. Periksa firebase.js.",

        "unavailable":
            "Server Firebase sedang tidak tersedia. Coba kembali.",

        "resource-exhausted":
            "Batas penggunaan Firebase tercapai. Silakan coba kembali nanti."

    };

    if (daftarError[kode]) {

        return daftarError[kode];

    }

    if (
        error.message?.includes(
            "Missing or insufficient permissions"
        )
    ) {

        return "Akses Firestore ditolak. Periksa Rules Firebase.";

    }

    return "Pendaftaran gagal. Silakan periksa koneksi dan coba kembali.";

}

// =====================================
// 8. PROSES PENDAFTARAN
// =====================================

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    hapusPesan();

    const nik = nikInput.value
        .trim()
        .toUpperCase();

    const nama = namaInput.value
        .trim();

    const jabatan = jabatanInput.value
        .trim();

    const password = passwordInput.value;

    const konfirmasi = konfirmasiInput.value;

    // =================================
    // VALIDASI NIK
    // =================================

    if (!/^[A-Z0-9]{5,30}$/.test(nik)) {

        tampilPesan(
            "NIK harus terdiri dari 5 sampai 30 karakter huruf atau angka.",
            "error"
        );

        nikInput.focus();

        return;

    }

    // =================================
    // VALIDASI NAMA
    // =================================

    if (nama.length < 2) {

        tampilPesan(
            "Nama lengkap harus diisi minimal 2 karakter.",
            "error"
        );

        namaInput.focus();

        return;

    }

    // =================================
    // VALIDASI JABATAN
    // =================================

    if (jabatan.length < 2) {

        tampilPesan(
            "Jabatan harus diisi minimal 2 karakter.",
            "error"
        );

        jabatanInput.focus();

        return;

    }

    // =================================
    // VALIDASI PASSWORD
    // =================================

    if (password.length < 6) {

        tampilPesan(
            "Password minimal 6 karakter.",
            "error"
        );

        passwordInput.focus();

        return;

    }

    // =================================
    // VALIDASI KONFIRMASI
    // =================================

    if (password !== konfirmasi) {

        tampilPesan(
            "Konfirmasi password tidak sama.",
            "error"
        );

        konfirmasiInput.focus();

        return;

    }

    // =================================
    // TOMBOL PROSES
    // =================================

    tombolDaftar.disabled = true;

    tombolDaftar.textContent =
        "Memproses Pendaftaran...";

    tampilPesan(
        "Sedang membuat akun WAINI. Mohon tunggu dan jangan menutup halaman.",
        "proses"
    );

    let userBaru = null;

    let dataBerhasilTersimpan = false;

    // =================================
    // 9. PROSES FIREBASE
    // =================================

    try {

        const emailInternal =
            nik.toLowerCase() +
            "@waini-dtk.invalid";

        // =================================
        // BUAT AKUN FIREBASE AUTH
        // =================================

        const hasilAuth =
            await createUserWithEmailAndPassword(
                auth,
                emailInternal,
                password
            );

        userBaru = hasilAuth.user;

        // =================================
        // BUAT BATCH FIRESTORE
        // =================================

        const batch = writeBatch(db);

        // =================================
        // 10. DATA PENGGUNA (PRIBADI)
        // =================================

        const referensiPengguna = doc(
            db,
            KOLEKSI_PENGGUNA,
            userBaru.uid
        );

        batch.set(
            referensiPengguna,
            {

                uid: userBaru.uid,

                nik: nik,

                nama: nama,

                jabatan: jabatan,

                email: emailInternal,

                role: "karyawan",

                status: "menunggu_verifikasi",

                hak_akses: [],

                createdAt: serverTimestamp(),

                updatedAt: serverTimestamp()

            }
        );

        // =================================
        // 11. STATUS PUBLIK
        // HANYA NAMA DAN STATUS
        // TIDAK MENYIMPAN NIK
        // =================================

        const referensiStatusPublik = doc(
            db,
            KOLEKSI_STATUS_PUBLIK,
            userBaru.uid
        );

        batch.set(
            referensiStatusPublik,
            {

                nama: nama,

                status: "Menunggu Verifikasi",

                createdAt: serverTimestamp()

            }
        );

        // =================================
        // 12. SIMPAN KEDUA DOKUMEN
        // =================================

        await batch.commit();

        dataBerhasilTersimpan = true;

        // =================================
        // 13. KELUAR OTOMATIS
        // =================================

        try {

            await signOut(auth);

        } catch (errorLogout) {

            console.error(
                "Logout otomatis gagal:",
                errorLogout
            );

        }

        // =================================
        // 14. PENDAFTARAN BERHASIL
        // =================================

        tampilPesan(
            "Pendaftaran berhasil! Status Anda: Menunggu Verifikasi. Silakan cek status pendaftaran secara berkala.",
            "sukses"
        );

        form.reset();

        tombolDaftar.disabled = true;

        tombolDaftar.textContent =
            "Pendaftaran Berhasil";

    } catch (error) {

        console.error(
            "Kesalahan pendaftaran:",
            error
        );

        // =================================
        // 15. HAPUS AUTH JIKA PENYIMPANAN GAGAL
        // =================================

        if (
            userBaru &&
            !dataBerhasilTersimpan
        ) {

            try {

                await deleteUser(userBaru);

                console.log(
                    "Akun Auth sementara berhasil dihapus."
                );

            } catch (hapusError) {

                console.error(
                    "Penghapusan akun sementara gagal:",
                    hapusError
                );

                try {

                    await signOut(auth);

                } catch (logoutError) {

                    console.error(
                        "Logout gagal:",
                        logoutError
                    );

                }

                tampilPesan(
                    "Penyimpanan profil gagal dan akun sementara belum berhasil dihapus. Jangan mencoba mendaftar ulang menggunakan NIK ini. Hubungi Super Admin.",
                    "error"
                );

                tombolDaftar.disabled = false;

                tombolDaftar.textContent =
                    "Daftar Sekarang";

                return;

            }

        }

        // =================================
        // 16. TAMPILKAN ERROR
        // =================================

        tampilPesan(
            terjemahkanError(error),
            "error"
        );

        tombolDaftar.disabled = false;

        tombolDaftar.textContent =
            "Daftar Sekarang";

    }

});

// =====================================
// 17. KONDISI AWAL
// =====================================

tombolDaftar.disabled = false;

tombolDaftar.textContent =
    "Daftar Sekarang";

</script>

</body>
</html>
